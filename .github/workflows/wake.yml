# Wakes the Mendy dashboard bot every minute (Vercel's free plan only allows a daily cron).
# GitHub delays/skips scheduled runs, so each run keeps calling for ~5h50m (public repos have unlimited minutes).
# Hourly schedule + a queue of one pending run keeps coverage continuous: when a run ends, the queued one starts.
name: wake
on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '17 4 1 * *'      # monthly keep-alive so GitHub never disables the schedule
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wake
  cancel-in-progress: false
jobs:
  tick:
    if: github.event.schedule != '17 4 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Call /api/tick once a minute for ~5h50m
        run: |
          end=$(( $(date +%s) + 350*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            ( curl -s -m 290 https://mendy-dashboard.vercel.app/api/tick; echo ) &
            sleep 60
          done
          wait
  keepalive:
    if: github.event.schedule == '17 4 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > last-keepalive.txt
          git config user.name "wake-bot" && git config user.email "actions@users.noreply.github.com"
          git add last-keepalive.txt && git commit -m "keep-alive" && git push
