# Wakes the Mendy dashboard bot every minute (Vercel's free plan only allows a daily cron).
# Each run calls the tick endpoint once a minute for ~5h50m and then starts the next run itself (workflow_dispatch),
# so the chain never depends on GitHub's unreliable scheduler. The schedule below only restarts the chain if it ever breaks.
name: wake
on:
  schedule:
    - cron: '*/30 * * * *'
    - cron: '17 4 1 * *'      # monthly keep-alive so GitHub never disables the schedule
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: wake
  cancel-in-progress: false
jobs:
  tick:
    if: github.event.schedule != '17 4 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Call /api/tick once a minute for ~5h50m
        run: |
          end=$(( $(date +%s) + 349*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            ( curl -s -m 290 https://mendy-dashboard.vercel.app/api/tick; echo ) &
            sleep 60
          done
          wait
      - name: Start the next run (keeps the chain going)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wake.yml -R "$GITHUB_REPOSITORY" --ref main
  keepalive:
    if: github.event.schedule == '17 4 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > last-keepalive.txt
          git config user.name "wake-bot" && git config user.email "actions@users.noreply.github.com"
          git add last-keepalive.txt && git commit -m "keep-alive" && git push
