# Wakes the Mendy dashboard bot every minute (Vercel's free plan only allows a daily cron).
# Each run calls the public tick endpoint 5 times, one minute apart; runs are scheduled every 5 minutes.
name: wake
on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '17 4 1 * *'      # monthly keep-alive so GitHub never disables the schedule
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wake
  cancel-in-progress: false
jobs:
  tick:
    if: github.event.schedule != '17 4 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Call /api/tick once a minute
        run: |
          for i in 1 2 3 4 5; do
            ( curl -s -m 290 https://mendy-dashboard.vercel.app/api/tick; echo ) &
            sleep 60
          done
          wait
  keepalive:
    if: github.event.schedule == '17 4 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > last-keepalive.txt
          git config user.name "wake-bot" && git config user.email "actions@users.noreply.github.com"
          git add last-keepalive.txt && git commit -m "keep-alive" && git push
